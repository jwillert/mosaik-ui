[versions]
kotlin = "2.1.20"
kotest = "5.9.1"
ktor = "3.1.3"
kotlinx-html = "0.12.0"
kotlinx-serialization = "1.8.1"
playwright = "1.49.0"
testcontainers = "1.20.4"
imageComparison = "4.4.0"
ktlint = "12.1.2"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-framework-datatest = { module = "io.kotest:kotest-framework-datatest", version.ref = "kotest" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-html-builder = { module = "io.ktor:ktor-server-html-builder", version.ref = "ktor" }

kotlinx-html = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.ref = "kotlinx-html" }

playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
image-comparison = { module = "com.github.romankh3:image-comparison", version.ref = "imageComparison" }
