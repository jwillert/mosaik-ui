name: Agent Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: agent-implement-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Preflight existing PR and blockers
        id: preflight
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --state open \
            --search "in:body \"#${ISSUE_NUMBER}\"" \
            --json number,url,body,author \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves)\\\\s+#${ISSUE_NUMBER}\\\\b\"))]")
          count=$(echo "$existing" | jq 'length')
          refused=false
          existing_pr_url=""
          for i in $(seq 0 $((count - 1))); do
            author=$(echo "$existing" | jq -r ".[$i].author.login")
            if gh api "repos/${GH_REPO}/collaborators/${author}" --silent 2>/dev/null; then
              refused=true
              existing_pr_url=$(echo "$existing" | jq -r ".[$i].url")
              break
            fi
          done

          native_blockers=$(gh issue view "$ISSUE_NUMBER" --json blockedBy -q '.blockedBy.nodes[].number' || true)
          body_blockers=$(gh issue view "$ISSUE_NUMBER" --json body -q '.body' |
            awk '
              BEGIN { in_blocked_by = 0 }
              /^##[[:space:]]+Blocked by[[:space:]]*$/ { in_blocked_by = 1; next }
              /^##[[:space:]]+/ { if (in_blocked_by) exit }
              in_blocked_by { print }
            ' |
            grep -Eoi '#[0-9]+' |
            tr -d '#' || true)

          open_blockers=""
          all_blockers=$(printf '%s\n%s\n' "$native_blockers" "$body_blockers" | grep -E '^[0-9]+$' | sort -nu || true)
          while IFS= read -r blocker; do
            [ -n "$blocker" ] || continue
            line=$(gh issue view "$blocker" --json number,title,state,url \
              -q 'select(.state != "CLOSED") | "- #\(.number) \(.title) (\(.state)): \(.url)"')
            if [ -n "$line" ]; then
              open_blockers="${open_blockers}${line}"$'\n'
            fi
          done <<< "$all_blockers"

          blocked=false
          if [ -n "$open_blockers" ]; then
            blocked=true
          fi

          echo "refused=$refused" >> "$GITHUB_OUTPUT"
          echo "existing_pr_url=$existing_pr_url" >> "$GITHUB_OUTPUT"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          {
            echo "open_blockers<<EOF"
            printf '%s' "$open_blockers"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse existing PR
        if: steps.preflight.outputs.refused == 'true'
        env:
          EXISTING_PR_URL: ${{ steps.preflight.outputs.existing_pr_url }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: $EXISTING_PR_URL already targets this issue. Close it first, then re-add \`agent:implement\`."

      - name: Refuse open blockers
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked == 'true'
        env:
          OPEN_BLOCKERS: ${{ steps.preflight.outputs.open_blockers }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          body_file="${RUNNER_TEMP}/open-blockers-comment.md"
          {
            echo "Refused to run: prerequisite issues are still open."
            echo
            echo "$OPEN_BLOCKERS"
            echo "Close the blockers or remove the \`Blocked by\` relationships, then re-add \`agent:implement\`."
          } > "$body_file"
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"

      - name: Transition labels
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout main
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute branch name
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        id: branch
        run: |
          slug=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          branch="agent/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Setup Java
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root Node dependencies
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        run: npm ci

      - name: Install module Node dependencies
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        run: |
          npm ci --prefix mosaik-components
          npm ci --prefix mosaik-docs

      - name: Install Pi Agent
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Restore Pi auth
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        env:
          PI_AUTH_JSON_B64: ${{ secrets.PI_AUTH_JSON_B64 }}
        run: |
          mkdir -p ~/.pi/agent
          echo "$PI_AUTH_JSON_B64" | base64 -d > ~/.pi/agent/auth.json
          chmod 600 ~/.pi/agent/auth.json
          cat > ~/.pi/agent/settings.json <<'EOF'
          {
            "defaultProvider": "openai-codex",
            "defaultModel": "gpt-5-codex",
            "theme": "dark"
          }
          EOF

      - name: Preflight build
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        run: ./gradlew --no-daemon build

      - name: Run implementation agent
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        env:
          PI_MODEL: gpt-5-codex
          PI_THINKING: high
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/implement/implement.ts

      - name: Push branch
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --force origin "$BRANCH"

      - name: Open draft PR
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true' && success()
        id: open_pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          title="Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          title="${title:0:256}"
          body_file="${RUNNER_TEMP}/pr-body.md"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Implemented by the Sandcastle agent workflow."
          } > "$body_file"
          pr_url=$(gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file "$body_file" | tail -n1)
          echo "pr_number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"

      - name: Request automated review
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -n "$AGENT_PAT" ]; then
            GH_TOKEN="$AGENT_PAT" gh pr edit "$PR_NUMBER" --add-label "agent:review"
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
          fi
          GH_TOKEN="$GITHUB_TOKEN_FALLBACK" gh pr edit "$PR_NUMBER" --add-label "agent:review"

      - name: Mark blocked on failure
        if: steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.preflight.outputs.refused != 'true' && steps.preflight.outputs.blocked != 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
