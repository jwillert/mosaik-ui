<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mosaik UI icon</title>
  <desc id="desc">A rounded square mosaic mark forming an abstract letter M.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="56" x2="440" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17172f"/>
      <stop offset="1" stop-color="#080814"/>
    </linearGradient>
    <linearGradient id="tileA" x1="120" y1="104" x2="392" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
