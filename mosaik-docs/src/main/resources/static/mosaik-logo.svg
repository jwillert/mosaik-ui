<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" role="img" aria-labelledby="title desc">
  <title id="title">Mosaik UI logo</title>
  <desc id="desc">Mosaik UI wordmark with a colorful mosaic icon.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="24" x2="228" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17172f"/>
      <stop offset="1" stop-color="#080814"/>
    </linearGradient>
    <linearGradient id="tileA" x1="64" y1="52" x2="192" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="tileB" x1="48" y1="204" x2="208" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bg)"/>
  <g>
    <rect x="58" y="60" width="38" height="38" rx="11" fill="url(#tileA)"/>
    <rect x="109" y="60" width="38" height="38" rx="11" fill="#38bdf8"/>
    <rect x="160" y="60" width="38" height="38" rx="11" fill="url(#tileA)"/>
