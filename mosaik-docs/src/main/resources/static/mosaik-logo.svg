    <rect x="109" y="111" width="38" height="38" rx="11" fill="url(#tileB)" transform="rotate(45 128 130)"/>
    <rect x="160" y="111" width="38" height="38" rx="11" fill="#22d3ee"/>
    <rect x="58" y="162" width="38" height="38" rx="11" fill="#7c3aed"/>
